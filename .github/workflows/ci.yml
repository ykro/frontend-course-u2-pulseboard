name: CI PulseBoard (retroalimentación)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias exactas del lockfile
        run: npm ci

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Tests (Vitest)
        run: npm run test

      - name: Build (Vite)
        run: npm run build

      - name: Aviso sobre la nota
        if: always()
        run: |
          {
            echo "## Resultado de CI"
            echo ""
            echo "Este resultado es retroalimentación, no tu nota."
            echo "La nota oficial la calcula el calificador del curso con los tests oficiales,"
            echo "tests ocultos del reto, mutantes para tus tests propios y una"
            echo "verificación de integridad (tests oficiales y workflow sin modificar)."
          } >> "$GITHUB_STEP_SUMMARY"
