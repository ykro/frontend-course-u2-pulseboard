name: CI PulseBoard (retroalimentación)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias exactas del lockfile
        run: npm ci

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Tests (Vitest)
        run: npm run test

      - name: Build (Vite)
        run: npm run build

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Resultado de CI"
            echo ""
            echo "Este resultado es retroalimentación sobre tu trabajo."
            echo "Los tests públicos del reto son una muestra: el contrato completo del README"
            echo "tiene más casos borde y otros datos. Escribe tus propios tests y no modifiques"
            echo "los tests oficiales ni este workflow."
          } >> "$GITHUB_STEP_SUMMARY"
